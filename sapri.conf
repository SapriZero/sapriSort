# ------------------------------------------------------------------------------
# SAPRI OPTIMIZER CONFIGURATION FILE
# ------------------------------------------------------------------------------

[General]
# Base stability threshold (0.0 to 1.0). 
# Higher values make Sapri more protective of system resources.
soglia_base = 0.65

# Global aggressiveness multiplier (K-Factor).
# It multiplies all trigger thresholds. 
# 1.0 = Default. > 1.0 = More aggressive. < 1.0 = More conservative.
k_factor = 1.0

# Execution interval in milliseconds.
# Defines how often the optimizer checks system sensors and applies policies.
intervallo_ms = 1000

# Enable detailed logging to stdout for monitoring actions and state changes.
verbose = true


[Hardware_Paths]
# Sub-path for CPU governor control (relative to /sys/devices/system/cpu/cpuX/)
path_cpu_gov = cpufreq/scaling_governor

# System path for kernel swappiness (0 to 100)
path_swappiness = /proc/sys/vm/swappiness

# System path for Zswap pool size (percentage of RAM)
path_zswap_pool = /sys/module/zswap/parameters/max_pool_percent

# System path for block device read-ahead (in KB)
path_disk_ra = /sys/block/sda/queue/read_ahead_kb

# System path to trigger kernel cache dropping
path_drop_caches = /proc/sys/vm/drop_caches


[Policy_Details]
# Configuration for specific optimization modules.
# Format: [trigger_low, hysteresis, time_weight]
# - trigger_low: stability level that activates the policy.
# - hysteresis: buffer to prevent rapid switching (Schmitt Trigger logic).
# - time_weight: multiplier for base interval (defines the specific cooldown).

# Boost CPU to performance mode
policy_cpu_turbo = 0.65, 0.50, 1.0

# Increase disk read-ahead
policy_io_boost = 0.35, 0.25, 2.0

# Aggressive memory compression via ZRAM
policy_zram_boost = 1.20, 0.30, 3.0

# Increase Zswap pool size during heavy swap usage
policy_zswap_heavy = 0.65, 0.15, 4.5

# Isolate processes in restricted cgroups
policy_sandbox = 0.65, 0.20, 0.8

# Global process priority and resource restrictions
policy_restriction = 0.65, 0.10, 0.5


[Process_Management]
# Critical system processes that must NEVER be throttled or killed.
whitelist = Xorg, wayland, gnome-shell, dbus-daemon, systemd, sapri, kswapd0, pulseaudio, pipewire, bash, sudo

# Explicitly targeted processes for maximum restriction.
blacklist =
